plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanbuddy.voice'
    compileSdk 34

    defaultConfig {
        applicationId "com.lanbuddy.voice"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK implementation (zero external dependencies for fast APK build)
}
